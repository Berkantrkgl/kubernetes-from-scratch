---
# Joins the workers. Safe to re-run -- a joined node is skipped.
#
#   ansible-playbook playbooks/03-worker-join.yml

- name: Join the workers to the cluster
  hosts: workers
  become: true

  tasks:

    # asked for once and reused, rather than read from a file the control plane
    # printed hours ago -- the token from kubeadm init only lives 24 hours
    - name: Ask the control plane for a join command
      ansible.builtin.command: kubeadm token create --print-join-command
      delegate_to: "{{ groups['control_plane'][0] }}"
      run_once: true
      register: join_command
      changed_when: false
      no_log: true
      tags: [join]

    - name: Join the cluster
      ansible.builtin.command: "{{ join_command.stdout }}"
      args:
        creates: /etc/kubernetes/kubelet.conf
      no_log: true
      tags: [join]

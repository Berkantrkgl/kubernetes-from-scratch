---
# CNI, LoadBalancer, ingress and storage. Runs from the control plane, which is where
# the kubeconfig and helm live. Safe to re-run.
#
#   ansible-playbook playbooks/04-platform.yml

- name: Install the platform components
  hosts: control_plane
  become: true

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:

    # server-side because some Calico CRDs are larger than the 262 KB annotation that
    # client-side apply writes. A separate chart, not a release -- Helm never upgrades
    # CRDs it owns
    - name: Install the Calico CRDs
      ansible.builtin.shell: >-
        set -o pipefail &&
        helm template calico-crds crd.projectcalico.org.v1
        --repo https://docs.tigera.io/calico/charts
        --version {{ calico_version }}
        | kubectl apply --server-side -f -
      args:
        executable: /bin/bash
      # server-side apply prints serverside-applied whether or not anything moved,
      # so there is nothing here to report a change from
      changed_when: false
      tags: [calico]

    - name: Install Calico
      kubernetes.core.helm:
        name: calico
        chart_ref: tigera-operator
        chart_repo_url: https://docs.tigera.io/calico/charts
        chart_version: "{{ calico_version }}"
        release_namespace: tigera-operator
        create_namespace: true
        values_files: [/vagrant/cluster/calico/values.yaml]
        state: present
      tags: [calico]

    - name: Wait for every node to report Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=300s
      changed_when: false
      tags: [calico]

    - name: Install MetalLB
      kubernetes.core.helm:
        name: metallb
        chart_ref: metallb
        chart_repo_url: https://metallb.github.io/metallb
        chart_version: "{{ metallb_chart_version }}"
        release_namespace: metallb-system
        create_namespace: true
        values_files: [/vagrant/cluster/metallb/values.yaml]
        state: present
      tags: [metallb]

    - name: Wait for the MetalLB controller
      ansible.builtin.command: >-
        kubectl wait --for=condition=Available deployment/metallb-controller
        -n metallb-system --timeout=300s
      changed_when: false
      tags: [metallb]

    # Available follows the readiness probe on :17472, but the webhook listens on :9443,
    # so the deployment can be ready while the pool is still refused. nothing publishes
    # "my webhook accepts connections", so retry instead
    - name: Apply the MetalLB address pool
      ansible.builtin.command: kubectl apply -f /vagrant/cluster/metallb/pool.yaml
      register: metallb_pool
      until: metallb_pool.rc == 0
      retries: 12
      delay: 5
      changed_when: "'configured' in metallb_pool.stdout or 'created' in metallb_pool.stdout"
      tags: [metallb]

    # an OCI registry, so the chart is pulled the way a container image is
    - name: Install the NGINX ingress controller
      kubernetes.core.helm:
        name: nginx-ingress
        chart_ref: oci://ghcr.io/nginx/charts/nginx-ingress
        chart_version: "{{ ingress_chart_version }}"
        release_namespace: nginx-ingress
        create_namespace: true
        values_files: [/vagrant/cluster/ingress/values.yaml]
        state: present
      tags: [ingress]

    - name: Look for the local-path provisioner
      ansible.builtin.command: kubectl get deployment local-path-provisioner -n local-path-storage
      register: local_path_state
      changed_when: false
      failed_when: false
      tags: [storage]

    - name: Install the local-path provisioner
      ansible.builtin.command: >-
        kubectl apply -f
        https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ local_path_version }}/deploy/local-path-storage.yaml
      when: local_path_state.rc != 0
      tags: [storage]

    - name: Read the storage classes
      ansible.builtin.command: kubectl get storageclass
      register: storage_classes
      changed_when: false
      tags: [storage]

    # annotate not patch, the command module's shlex eats the quotes JSON needs
    - name: Make local-path the default storage class
      ansible.builtin.command: >-
        kubectl annotate storageclass local-path
        storageclass.kubernetes.io/is-default-class=true --overwrite
      when: "'local-path (default)' not in storage_classes.stdout"
      tags: [storage]

    - name: Read the current node labels
      ansible.builtin.command: >-
        kubectl get node {{ item.node }}
        -o jsonpath={.metadata.labels.{{ item.key }}}
      loop: "{{ node_labels }}"
      loop_control:
        label: "{{ item.node }} {{ item.key }}"
      register: current_labels
      changed_when: false
      tags: [labels]

    # labels rather than node names, so every nodeSelector downstream survives a
    # rename. kubectl label is not idempotent on its own, hence the read above
    - name: Label the nodes
      ansible.builtin.command: >-
        kubectl label node {{ item.item.node }}
        {{ item.item.key }}={{ item.item.value }} --overwrite
      loop: "{{ current_labels.results }}"
      loop_control:
        label: "{{ item.item.node }} {{ item.item.key }}={{ item.item.value }}"
      when: item.stdout != item.item.value
      tags: [labels]

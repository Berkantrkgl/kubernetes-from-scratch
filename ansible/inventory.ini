# node_ip is the eth1 address. eth0 is Vagrant's NAT interface and is 10.0.2.15
# on all three VMs, so kubelet has to be told which one to use.
# The case study calls node-2 "Node 3" -- that's where Jenkins goes.

[control_plane]
k8s-master  ansible_host=10.50.0.10  node_ip=10.50.0.10

[workers]
node-1      ansible_host=10.50.0.11  node_ip=10.50.0.11
node-2      ansible_host=10.50.0.12  node_ip=10.50.0.12

[k8s_cluster:children]
control_plane
workers

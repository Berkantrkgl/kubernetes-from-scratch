[defaults]
inventory = inventory.ini
remote_user = vagrant
private_key_file = ~/.vagrant.d/insecure_private_keys/vagrant.key.rsa

# VMs get destroyed and recreated often, host keys change every time
host_key_checking = False

stdout_callback = yaml
callbacks_enabled = profile_tasks
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
# IdentitiesOnly matters on current (my) host: the desktop keyring agent holds six keys
# and sshd stops at six attempts, before ours is ever offered
ssh_args = -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

# reuse one SSH connection for all tasks instead of opening one per task
pipelining = True

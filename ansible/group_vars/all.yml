---
# interpreter discovery probes a dozen candidates and falls back to /usr/bin/python,
# which 24.04 does not have, when the probe comes back empty. It did once, seconds after
# vagrant up. The box is pinned, so the interpreter can be too
ansible_python_interpreter: /usr/bin/python3

kubernetes_version: "1.36.4"
kubernetes_apt_channel: "v1.36"   # repo is per minor, package version is per patch

# picked to avoid Calico's 192.168/16, docker0's 172.17/16 and the node net
pod_cidr: "10.32.0.0/16"
service_cidr: "10.96.0.0/16"      # /16 not kubeadm's /12, keeps iptables smaller

cluster_dns_domain: "cluster.local"
control_plane_endpoint: "10.50.0.10:6443"

# has to match kubelet's cgroupDriver
containerd_cgroup_driver: "systemd"

required_kernel_modules:
  - overlay
  - br_netfilter   # bridged pod traffic skips netfilter without it, Services then
                   # fail silently between pods on the same node

helm_version: "4.2.4"             # matches the Helm that ArgoCD 3.5.x bundles

calico_version: "v3.32.1"
metallb_chart_version: "0.16.1"
ingress_chart_version: "2.6.4"    # nginx/kubernetes-ingress, not kubernetes/ingress-nginx
local_path_version: "v0.0.37"

jenkins_chart_version: "5.9.54"
kps_chart_version: "88.5.4"       # kube-prometheus-stack
eck_chart_version: "3.5.0"
fluent_bit_chart_version: "0.58.1"

# elasticsearch's own version is in k8s/monitoring/elasticsearch.yaml, since that
# is a manifest rather than a chart flag. one source of truth, not two

# node roles, by label rather than by name so a rename does not break them
node_labels:
  - { node: node-2, key: workload,   value: jenkins }   # the case's "Node 3"
  - { node: node-2, key: monitoring, value: metrics }   # prometheus, grafana
  - { node: node-1, key: monitoring, value: logs }      # elasticsearch

jenkins_node: node-2

# every hostname ExternalDNS creates lives under this zone
dns_zone: "k8s.berkan.link"

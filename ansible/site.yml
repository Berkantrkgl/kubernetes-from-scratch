---
# The whole cluster, from three fresh VMs to everything it runs.
#
#   vagrant up
#   cd ansible && ansible-playbook site.yml -e @../docs/route53.yml
#
# That file holds the Route53 key and is gitignored. -e @file rather than -e key=value,
# so the key never reaches argv. Only needed on the first run: after that the Secret it
# created is what 05 finds. Every other credential is generated on the node.

- ansible.builtin.import_playbook: playbooks/01-node-prep.yml
- ansible.builtin.import_playbook: playbooks/02-control-plane.yml
- ansible.builtin.import_playbook: playbooks/03-worker-join.yml
- ansible.builtin.import_playbook: playbooks/04-platform.yml
- ansible.builtin.import_playbook: playbooks/05-externaldns.yml
- ansible.builtin.import_playbook: playbooks/06-monitoring.yml
- ansible.builtin.import_playbook: playbooks/07-jenkins.yml
- ansible.builtin.import_playbook: playbooks/08-app.yml
- ansible.builtin.import_playbook: playbooks/09-webhook.yml

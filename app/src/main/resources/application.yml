server:
  port: 9001
  shutdown: graceful

app:
  # kubernetes sets HOSTNAME to the pod name, no downward api needed
  instance: ${HOSTNAME:local}

spring:
  application:
    name: query-echo
    # filtered by maven at build time, lands in the ecs log line as service.version
    version: "@project.version@"
  main:
    # the banner goes straight to System.out otherwise, before logging is configured
    banner-mode: log
  lifecycle:
    # in-flight requests finish instead of being cut off mid-response on SIGTERM
    timeout-per-shutdown-phase: 25s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # splits /actuator/health into a readiness and a liveness group
      probes:
        enabled: true
  metrics:
    distribution:
      # without this micrometer emits count, sum and max but no buckets, and
      # histogram_quantile has nothing to read
      percentiles-histogram:
        http.server.requests: true

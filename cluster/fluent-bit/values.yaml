kind: DaemonSet

# the credential lives in this namespace, next to Elasticsearch
env:
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: logs-es-elastic-user
        key: elastic

# every node's logs, control plane included
tolerations:
  - operator: Exists

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    # Read_from_Head alone would resend every file on restart. with the DB a known
    # file resumes at its offset and only a new one is read whole
    [INPUT]
        Name tail
        Tag kube.*
        Path /var/log/containers/*.log
        multiline.parser cri
        Read_from_Head On
        DB /var/log/flb-kube.db
        DB.Sync Normal
        Mem_Buf_Limit 16MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host logs-es-http.monitoring.svc
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ES_PASSWORD}
        Logstash_Format On
        Logstash_Prefix k8s
        Suppress_Type_Name On
        Replace_Dots On
        Retry_Limit False

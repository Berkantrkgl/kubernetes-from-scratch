resources:
  requests:
    cpu: 100m
    memory: 150Mi
  limits:
    memory: 512Mi          # chart ships 1Gi and a cpu limit, neither is needed here

# off by default. the component that watches everything should be watched too
config:
  metrics:
    port: "8080"

# the chart must not render a PodMonitor: that CRD arrives with kube-prometheus-stack,
# which is installed after this. ours lives in k8s/monitoring/ instead
podMonitor:
  enabled: false

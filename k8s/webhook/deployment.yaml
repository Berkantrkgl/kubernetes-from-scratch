---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-requests-webhook
  namespace: webhook
  labels:
    app.kubernetes.io/name: resource-requests-webhook
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: resource-requests-webhook

  template:
    metadata:
      labels:
        app.kubernetes.io/name: resource-requests-webhook

    spec:
      # both replicas on one node would make failurePolicy: Fail a single node failure
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: resource-requests-webhook

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: webhook
          image: berkantrkgl/resource-requests-webhook:0.1.0

          ports:
            - name: https
              containerPort: 8443

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10

          volumeMounts:
            - name: certs
              mountPath: /etc/webhook/certs
              readOnly: true

      volumes:
        # generated on the node and applied by ansible, never in this repository
        - name: certs
          secret:
            secretName: webhook-tls

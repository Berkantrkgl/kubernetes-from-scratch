---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# webhook-configuration.yaml is deliberately not here. it carries a caBundle that only
# exists once the certificate has been generated, and pointing the apiserver at a
# service whose pods are not ready yet fails every Deployment write in the cluster.
# ansible applies it last, with the CA filled in.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

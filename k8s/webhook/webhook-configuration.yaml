---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: resource-requests
webhooks:
  - name: resource-requests.k8s.local
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5

    # kube-system and this webhook's own namespace are excluded so a broken webhook
    # cannot block the deploy that fixes it. the rest are upstream charts whose
    # deployments ship without requests -- tigera-operator reconciles calico
    # continuously, and a rejected reconcile would leave the CNI unable to repair itself
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - webhook
            - calico-system
            - tigera-operator
            - metallb-system
            - local-path-storage
            - monitoring

    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        scope: Namespaced

    clientConfig:
      service:
        name: resource-requests-webhook
        namespace: webhook
        path: /validate
        port: 443
      # filled in by ansible from the generated CA
      caBundle: ""

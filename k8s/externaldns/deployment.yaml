---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
spec:
  # one, and only one. there is no leader election, two instances would both
  # reconcile the same zone and fight over the same records
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns

  # RollingUpdate would briefly run the old and new pod together, which is the
  # thing replicas: 1 exists to prevent
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns

    spec:
      serviceAccountName: external-dns

      # upstream ships this image with USER 0. it is a static go binary that
      # only makes outbound https calls, so it does not need root
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.22.0

          args:
            - --source=service
            - --source=ingress
            - --provider=aws
            - --aws-zone-type=public
            # nothing outside this suffix is ever touched
            - --domain-filter=k8s.berkan.link
            # a TXT record is written beside every managed record, naming the
            # owner. without it a second cluster would delete these records
            - --registry=txt
            - --txt-owner-id=k8s-from-scratch
            # sync also removes records when their object goes, upsert-only never deletes
            - --policy=sync
            - --interval=1m

          env:
            - name: AWS_REGION
              value: us-east-1     # route53 is global but the sdk wants one
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: route53-credentials
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: route53-credentials
                  key: aws-secret-access-key

          ports:
            - name: metrics
              containerPort: 7979

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-sidecar
  namespace: query-echo
data:
  fluent-bit.conf: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf

    # only the active file. the rotated ones are .log.gz and re-reading them
    # after every roll would duplicate everything
    # this sidecar always starts before the application, so the file does not exist
    # yet when tail initialises. the 60s default Refresh_Interval plus reading from
    # the tail loses every line of the first minute, startup included
    [INPUT]
        Name tail
        Tag app
        Path /var/log/query-echo/application.log
        Parser json
        Refresh_Interval 5
        Read_from_Head On
        DB /var/lib/fluent-bit/tail.db
        DB.Sync Normal
        Mem_Buf_Limit 16MB
        Skip_Long_Lines On

    # the application does not know it runs in kubernetes, and the kubernetes
    # filter cannot help here: it identifies a pod from the container log path,
    # and this is a file inside the pod
    [FILTER]
        Name record_modifier
        Match app
        Record kubernetes.pod_name ${POD_NAME}
        Record kubernetes.namespace_name ${POD_NAMESPACE}
        Record kubernetes.host ${NODE_NAME}

    [OUTPUT]
        Name es
        Match app
        Host logs-es-http.monitoring.svc
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ES_PASSWORD}
        Logstash_Format On
        Logstash_Prefix query-echo
        Suppress_Type_Name On
        # Off here, On in the DaemonSet: this pipeline reads one schema we control,
        # that one reads whatever any container prints. keeping the dots lets
        # elasticsearch nest kubernetes.pod_name the way the DaemonSet does
        Replace_Dots Off
        Retry_Limit False
        # default is @timestamp, which would overwrite the one the application
        # wrote. keeping both separates event time from ingestion time
        Time_Key ingest_ts

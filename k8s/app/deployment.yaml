---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-echo
  namespace: query-echo
  labels:
    app.kubernetes.io/name: query-echo
spec:
  replicas: 4

  selector:
    matchLabels:
      app.kubernetes.io/name: query-echo

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # no surge pod: one goes first and its replacement takes the space it freed, so a
      # rollout needs no spare memory. maxUnavailable: 0 wanted a fifth pod and this
      # cluster had nowhere to put it
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: query-echo

    spec:
      # longer than the 25s graceful shutdown plus the preStop sleep
      terminationGracePeriodSeconds: 40

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # the default is Ignore, which counts the tainted control plane as an
          # empty domain and leaves two of the four pods Pending
          nodeTaintsPolicy: Honor
          # spread is computed per revision, otherwise old and new pods are
          # counted together and a rollout deadlocks against DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: query-echo

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532          # makes the emptyDir volumes writable by that uid
        seccompProfile:
          type: RuntimeDefault

      # a native sidecar, not a plain container: it starts before the application
      # so no line is missed, and it is stopped only after the application has
      # exited so the shutdown lines still get shipped
      initContainers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.1
          restartPolicy: Always

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi

          volumeMounts:
            - name: logs
              mountPath: /var/log/query-echo
              readOnly: true
            - name: fluent-bit-state
              mountPath: /var/lib/fluent-bit
            # a subPath, so the image's own parsers.conf next to it survives
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf

      containers:
        - name: query-echo
          image: berkantrkgl/query-echo:0.2.1

          ports:
            - name: http
              containerPort: 9001

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi    # no cpu limit, throttling hurts more than it protects

          # liveness stays parked until this passes, so a slow start is not a restart
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3

          lifecycle:
            preStop:
              # distroless has no shell, so the exec form of this cannot run.
              # buys time for the endpoint removal to reach every kube-proxy
              sleep:
                seconds: 5

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/query-echo

      volumes:
        # the only two paths the application's read-only root filesystem gives up
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}

        # the sidecar's tail position, kept out of the log directory on purpose
        - name: fluent-bit-state
          emptyDir: {}
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-sidecar

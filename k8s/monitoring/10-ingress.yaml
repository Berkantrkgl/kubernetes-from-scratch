apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  namespace: monitoring
  annotations:
    # elasticsearch has no route-prefix option, so it is the only backend here that
    # needs rewriting. F5 NIC keys a rewrite by service name, not by a regex group
    nginx.org/rewrites: "serviceName=logs-es-http rewrite=/"
spec:
  ingressClassName: nginx
  rules:
    # one host, one object. externaldns reads the host from here, no annotation
    - host: monitor.k8s.berkan.link
      http:
        paths:
          # each backend already serves its own prefix, so nothing is rewritten here
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: kps-prometheus
                port:
                  number: 9090
          - path: /alertmanager
            pathType: Prefix
            backend:
              service:
                name: kps-alertmanager
                port:
                  number: 9093
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: kps-grafana
                port:
                  number: 80
          # both, and the trailing slash is the one that matters: NIC builds the
          # rewrite as ^<path>(.*)$ -> /$1, so /elasticsearch/_cat becomes //_cat
          # without it and elasticsearch rejects the double slash
          - path: /elasticsearch
            pathType: Prefix
            backend:
              service:
                name: logs-es-http
                port:
                  number: 9200
          - path: /elasticsearch/
            pathType: Prefix
            backend:
              service:
                name: logs-es-http
                port:
                  number: 9200
